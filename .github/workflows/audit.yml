name: Audit

# A REUSABLE workflow — it does not run on its own. Other repos call it:
#
#   jobs:
#     audit:
#       uses: hawkesj12/workflows/.github/workflows/audit.yml@main
#
# It exists because these four checks find problems that appear WITHOUT your code
# changing: a CVE gets published against a dependency you haven't touched, a link
# in your README rots because someone else moved a page, an action tag gets
# repointed. A commit-triggered check can never catch those — there is no commit
# to trigger on. So the caller runs this on a schedule, and a failure emails you.
#
# Every job is independent: one failing does not hide the others.
# Every action is pinned to a SHA, not a tag — a tag can be repointed by whoever
# controls that repo, which is exactly what zizmor's unpinned-uses audit flags.

on:
  workflow_call:
    inputs:
      docs:
        description: "Files/globs lychee checks for dead links."
        type: string
        default: "README.md"
      scorecard:
        description: >-
          Run OpenSSF Scorecard. PUBLIC REPOS ONLY — it needs id-token: write and
          publishes results to the public OpenSSF API. Leave off for private repos.
        type: boolean
        default: false
      deps:
        description: >-
          Whether this repo has dependencies to scan. "auto" (the default) requires
          a lockfile and FAILS the audit if none is found, because osv-scanner with
          no lockfile reports success having examined nothing. Set "none" to declare
          a repo genuinely dependency-free — the CVE lane is then SKIPPED, which
          reads as skipped and not as passing. There is deliberately no setting that
          yields a GREEN CVE job without a lockfile.
        type: string
        default: auto

permissions:
  contents: read

jobs:
  # ── Workflow security ────────────────────────────────────────────────
  # Template injection, credential leakage, unpinned actions, cache poisoning.
  # Cheap and fast — nothing here reaches the network beyond the checkout.
  workflow-security:
    name: zizmor (workflow security)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false # else the token lands in .git/config (zizmor: artipacked)
      - uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          advanced-security: false # SARIF upload needs GHAS; plain output works everywhere

  # ── Dead links ───────────────────────────────────────────────────────
  # Link rot is the purest level-triggered failure: your docs stop being true
  # while nothing in your repo changes.
  links:
    name: lychee (dead links)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # --max-retries absorbs a flaky host so a transient blip doesn't page you
          # over someone else's downtime.
          args: --no-progress --max-retries 3 ${{ inputs.docs }}
          fail: true

  # ── Known vulnerabilities ────────────────────────────────────────────
  # The other genuinely level-triggered check: a CVE published today against a
  # dependency you last touched months ago.
  # Uses Google's REUSABLE WORKFLOW, not the bare action. Two reasons, both
  # learned by running it: the repo root has no action.yml (pinning
  # `google/osv-scanner-action@<sha>` fails with "Top level 'runs:' section is
  # required"), and the action's own description says it is "not intended to be
  # used directly" — invoking it that way exited 127 on arg parsing.
  #
  # PRECONDITION. osv-scanner reads lockfiles. Point it at a repo that has none
  # and it reports success having examined nothing — a green shield that reads
  # "no CVEs" but means "no scan". That is the worst state of the four checks
  # here, because nothing is broken: the code is fine, the config is fine, the
  # check is just aimed at empty space.
  #
  # lychee already refuses to pass on empty input ("No links were found"). This
  # job gives osv-scanner the same property from the outside, since the scan
  # itself runs in Google's reusable workflow and cannot be given a step.
  lockfile:
    name: lockfile present (CVE precondition)
    if: inputs.deps != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: A CVE scan needs a lockfile to be worth anything
        shell: bash
        run: |
          set -euo pipefail
          # Only TRACKED files count. An uncommitted lockfile is not what the
          # scheduled audit will check out next Monday.
          FOUND=$(git ls-files | grep -Ei '(^|/)(uv\.lock|poetry\.lock|Pipfile\.lock|pdm\.lock|requirements[^/]*\.txt|package-lock\.json|yarn\.lock|pnpm-lock\.yaml|npm-shrinkwrap\.json|Cargo\.lock|go\.sum|Gemfile\.lock|composer\.lock|gradle\.lockfile|mix\.lock|pubspec\.lock|renv\.lock|conan\.lock)$' || true)
          if [ -n "$FOUND" ]; then
            echo "Lockfiles the CVE scan can read:"
            echo "$FOUND" | sed 's/^/  /'
            exit 0
          fi
          cat >&2 <<'MSG'
          No lockfile found — the CVE lane of this audit is INACTIVE.

          osv-scanner resolves dependencies from lockfiles. With none committed it
          finds no package sources and passes, so a green audit would tell you
          "no known CVEs" when it actually means "nothing was scanned".

          Fix it one of two ways, both honest:
            * Commit a lockfile.  Python: `uv lock` (or poetry/pdm/pip-compile).
              Node: package-lock.json / pnpm-lock.yaml. It does not have to ship
              in your package — it pins the resolution CI audits.
            * If this repo genuinely has no dependencies, say so in the caller:
                  with:
                    deps: none
              The CVE job is then skipped rather than passing, and the claim is
              visible in your workflow file instead of implied by silence.
          MSG
          exit 1

  vulnerabilities:
    name: osv-scanner (CVEs)
    # Skipped when the precondition fails or when deps: none was declared. A
    # skipped job is honest; a passing one that scanned nothing is not.
    needs: lockfile
    permissions:
      # Must MATCH what the called workflow declares, and the caller must grant at
      # least this much — permissions only narrow down a reusable-workflow chain,
      # never widen. Getting this wrong is a startup_failure with no log at all.
      contents: read
      actions: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      scan-args: |-
        -r
        ./
      # SARIF upload needs Code Scanning enabled; keep this portable across repos.
      upload-sarif: false

  # ── Repo posture ─────────────────────────────────────────────────────
  # Branch protection, pinned dependencies, signed releases, CI-tests-required.
  # Opt-in: publishing results requires a public repo and an OIDC token.
  posture:
    name: scorecard (repo posture)
    if: inputs.scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC, so the OpenSSF API can verify who published
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
