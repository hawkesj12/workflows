name: Audit

# A REUSABLE workflow — it does not run on its own. Other repos call it:
#
#   jobs:
#     audit:
#       uses: hawkesj12/workflows/.github/workflows/audit.yml@main
#
# It exists because these four checks find problems that appear WITHOUT your code
# changing: a CVE gets published against a dependency you haven't touched, a link
# in your README rots because someone else moved a page, an action tag gets
# repointed. A commit-triggered check can never catch those — there is no commit
# to trigger on. So the caller runs this on a schedule, and a failure emails you.
#
# Every job is independent: one failing does not hide the others.
# Every action is pinned to a SHA, not a tag — a tag can be repointed by whoever
# controls that repo, which is exactly what zizmor's unpinned-uses audit flags.

on:
  workflow_call:
    inputs:
      docs:
        description: "Files/globs lychee checks for dead links."
        type: string
        default: "README.md"
      scorecard:
        description: >-
          Run OpenSSF Scorecard. PUBLIC REPOS ONLY — it needs id-token: write and
          publishes results to the public OpenSSF API. Leave off for private repos.
        type: boolean
        default: false
      deps:
        description: >-
          Whether this repo has dependencies to scan. "auto" (the default) runs
          osv-scanner, which FAILS on its own (exit 128) when it finds no package
          sources — so a repo with no lockfile gets a red audit, not a green one
          that scanned nothing. Set "none" only for a genuinely dependency-free
          repo: the CVE job is then SKIPPED, which reads as skipped rather than
          passing. There is no setting that reports success without a real scan.
        type: string
        default: auto

permissions:
  contents: read

jobs:
  # ── Workflow security ────────────────────────────────────────────────
  # Template injection, credential leakage, unpinned actions, cache poisoning.
  # Cheap and fast — nothing here reaches the network beyond the checkout.
  workflow-security:
    name: zizmor (workflow security)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false # else the token lands in .git/config (zizmor: artipacked)
      - uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          advanced-security: false # SARIF upload needs GHAS; plain output works everywhere

  # ── Dead links ───────────────────────────────────────────────────────
  # Link rot is the purest level-triggered failure: your docs stop being true
  # while nothing in your repo changes.
  links:
    name: lychee (dead links)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # --max-retries absorbs a flaky host so a transient blip doesn't page you
          # over someone else's downtime.
          args: --no-progress --max-retries 3 ${{ inputs.docs }}
          fail: true

  # ── Known vulnerabilities ────────────────────────────────────────────
  # The other genuinely level-triggered check: a CVE published today against a
  # dependency you last touched months ago.
  #
  # Runs the BINARY, not Google's reusable workflow and not their action. Both
  # wrappers turn a failed scan into a green job, and that was measured here, not
  # assumed:
  #
  #   * the reusable workflow runs the scanner with `continue-on-error: true`,
  #     then reports from a results.json the failed scan never wrote — so ANY
  #     failure (bad lockfile, deps.dev outage, OOM, registry timeout) exits 0.
  #   * the action alone is no better for the case that actually bites. On a repo
  #     with no lockfile the scanner correctly exits 128 and the action downgrades
  #     it to `##[warning]No lockfiles found` and passes. Its own log calls this
  #     deprecated and says to pass --allow-no-lockfiles for it — i.e. tolerance
  #     is today's default and erroring is the future one. We want the future one.
  #
  # The binary just returns its exit code, so every failure mode is covered at
  # once — including ones nobody has thought of — with nothing to maintain and no
  # third-party action in the CVE path at all. Pinned by version AND SHA-256, so
  # a retagged release cannot change what runs.
  #
  # Pinning the binary does mean Dependabot cannot bump it. That matters much less
  # than it looks: the vulnerability DATA is fetched live from OSV at scan time,
  # so an older binary still finds today's CVEs. The version only governs
  # ecosystem/lockfile-format support, which is a deliberate upgrade, not a race.
  vulnerabilities:
    name: osv-scanner (CVEs)
    # `deps: none` skips this job. A skipped job is an honest "nothing to scan";
    # a passing one that scanned nothing is not. There is deliberately no third
    # option that reports success without a real scan.
    if: inputs.deps != 'none'
    runs-on: ubuntu-latest
    permissions:
      # Only contents: read. The actions: read + security-events: write callers
      # used to need were the reusable workflow's requirements, not the scanner's.
      contents: read
    env:
      OSV_VERSION: v2.4.0
      OSV_SHA256: 00000000c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install osv-scanner (pinned, checksum-verified)
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          curl --fail --silent --show-error --location --retry 3 -o osv-scanner "$URL"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum --check --status \
            || { echo "::error::osv-scanner checksum mismatch — refusing to run it"; exit 1; }
          chmod +x osv-scanner
      - name: Scan
        shell: bash
        # No `continue-on-error`, no wrapper, no --allow-no-lockfiles. Exit 0 here
        # means a scan ran and found nothing. Every other outcome is a failure,
        # which is the entire point: 128 (no package sources) and 1 (vulns found)
        # both stop the audit rather than quietly passing.
        run: ./osv-scanner scan source --recursive ./

  # ── Repo posture ─────────────────────────────────────────────────────
  # Branch protection, pinned dependencies, signed releases, CI-tests-required.
  # Opt-in: publishing results requires a public repo and an OIDC token.
  posture:
    name: scorecard (repo posture)
    if: inputs.scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC, so the OpenSSF API can verify who published
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
